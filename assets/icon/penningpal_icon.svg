<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="PenningPal">
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="nibMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="nibGold" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <clipPath id="nibClip">
      <path d="M-52-152h104l46 106L0 158l-98-106z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#slate)"/>

  <!-- Card / slate -->
  <rect x="292" y="347" width="440" height="456" rx="52" ry="52"
        fill="#F8FAFC" fill-opacity="0.07" stroke="#F8FAFC" stroke-width="16"/>
  <path fill="none" stroke="#F8FAFC" stroke-linecap="round" stroke-width="10" opacity="0.38"
        d="M400 668h240"/>
  <path fill="none" stroke="#F8FAFC" stroke-linecap="round" stroke-width="10" opacity="0.28"
        d="M400 708h200"/>
  <path fill="none" stroke="#F8FAFC" stroke-linecap="round" stroke-width="10" opacity="0.18"
        d="M400 748h148"/>

  <!-- Fountain-pen nib, angled as if writing on the slate -->
  <g transform="translate(528 392) rotate(12)">
    <path d="M-52-152h104l46 106L0 158l-98-106z" fill="url(#nibMetal)"/>
    <path d="M-52-152h104l46 106L0 158l-98-106z" fill="url(#nibGold)"/>
    <circle cx="0" cy="28" r="16" fill="#0B0F19"/>
    <rect x="-3.1" y="-8" width="6.2" height="156" rx="3.1" fill="#0B0F19"/>
  </g>
</svg>
